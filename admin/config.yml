backend:
  name: github
  repo: trinhbinhchi/wiki-vhtk
  branch: main
  site_domain: vhtk.netlify.app
  base_url: https://api.netlify.com
  auth_endpoint: auth

site_url: "https://trinhbinhchi.github.io/wiki-vhtk/"
display_url: "https://trinhbinhchi.github.io/wiki-vhtk/"

media_folder: "assets/uploads"
public_folder: "/wiki-vhtk/assets/uploads"
publish_mode: simple

editor:
  preview: false

collections:
  - name: "articles"
    label: "📝 Bài viết"
    label_singular: "Bài viết"
    folder: "content/articles"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: ["order", "title"]
    editor:
      preview: false
    fields:
      - {label: "Tên bài viết", name: "title", widget: "string"}
      - {label: "Biểu tượng menu", name: "icon", widget: "string", required: false}
      - {label: "HTML biểu tượng", name: "icon_html", widget: "hidden", required: false}
      - {label: "Thứ tự", name: "order", widget: "number", value_type: "int", min: 1}
      - {label: "Hiển thị", name: "visible", widget: "boolean", default: true}
      - {label: "ID section", name: "section_id", widget: "hidden"}
      - {label: "Class section", name: "section_class", widget: "hidden", required: false}
      - label: "Nội dung bài viết"
        name: "section_html"
        widget: "exact_html_editor"

  - name: "settings"
    label: "⚙ Cài đặt website"
    editor:
      preview: false
    files:
      - name: "general"
        label: "Thông tin chung"
        file: "content/settings.json"
        format: "json"
        fields:
          - {label: "Tên cẩm nang", name: "site_title", widget: "string"}
          - {label: "Dòng phụ", name: "site_subtitle", widget: "string"}
          - {label: "Giới thiệu", name: "intro", widget: "text"}
          - {label: "Ghi chú nguồn", name: "source_note", widget: "text", hint: "Ví dụ: Nội dung được làm sạch và trình bày lại từ bản lưu Notion."}
          - {label: "Ghi chú hoạt động", name: "independent_note", widget: "text", hint: "Ví dụ: Website hoạt động độc lập, không cần giao diện Notion."}
